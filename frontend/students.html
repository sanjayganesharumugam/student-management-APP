<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students - Student Management System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-sms">
  <div class="container-fluid page-container py-0">
    <a class="navbar-brand" href="dashboard.html">Student Management System</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" data-page="dashboard" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" data-page="students" href="students.html">Students</a></li>
      </ul>
      <span id="navUsername" class="me-3"></span>
      <a href="#" id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </div>
</nav>

<div class="page-container">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h2 class="page-title mb-0">Students</h2>
    <a href="add-student.html" class="btn btn-primary-sms">+ Add Student</a>
  </div>

  <div class="panel mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-4">
        <label class="form-label">Search</label>
        <div class="input-group">
          <input type="text" class="form-control" id="searchInput" placeholder="Name, email or ID">
          <button class="btn btn-outline-secondary" id="searchBtn" type="button">Search</button>
        </div>
      </div>
      <div class="col-md-3">
        <label class="form-label">Department</label>
        <select class="form-select" id="departmentFilter">
          <option value="">All Departments</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Year</label>
        <select class="form-select" id="yearFilter">
          <option value="">All Years</option>
          <option value="1">Year 1</option>
          <option value="2">Year 2</option>
          <option value="3">Year 3</option>
          <option value="4">Year 4</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-outline-secondary w-100" id="clearFiltersBtn" type="button">Clear</button>
      </div>
      <div class="col-md-1 text-end text-muted small" id="resultCount"></div>
    </div>
  </div>

  <div class="panel p-0">
    <div class="table-responsive">
      <table class="table table-sms mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Year</th>
            <th>CGPA</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentsTableBody">
          <tr class="loading-row"><td colspan="7">Loading students...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete <strong id="deleteStudentName"></strong>? This cannot be undone.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/students.js"></script>
</body>
</html>

spring.application.name=student-management
server.port=8080

# ---------- Oracle database ----------
# Defaults below work for Oracle XE. Override them WITHOUT committing secrets, either with
# environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) or with the git-ignored file
# src/main/resources/application-local.properties (copy application-local.properties.example).
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:student_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---------- JPA / Hibernate ----------
# Tables are created by database/schema.sql, so Hibernate must not touch the schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Serve the frontend from the same server ----------
# Run the backend from the backend/ folder and open http://localhost:8080
spring.web.resources.static-locations=file:../frontend/,file:./frontend/

# Optional local overrides (ignored by git)
spring.config.import=optional:classpath:application-local.properties
